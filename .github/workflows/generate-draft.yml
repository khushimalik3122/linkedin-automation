name: Generate LELNOB LinkedIn draft

on:
  schedule:
    # Runs at 03:30 UTC (9:00 AM IST) on Monday, Wednesday, and Friday
    - cron: '30 3 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate LinkedIn draft
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
        run: python generate_post.py

      - name: Commit and push generated draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts/
          if git diff --staged --quiet; then
            echo "No new drafts to commit."
          else
            git commit -m "Add LELNOB LinkedIn draft ($(date -u +'%Y-%m-%d'))"
            git push
          fi
